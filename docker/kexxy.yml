# Overlay propio de KEXXY OS.
#
# Archivo nuevo: no existe en odysseus-dev/odysseus, así que `git pull` nunca
# lo toca. Mismo patrón que docker/gpu.nvidia.yml, y por eso se engancha por
# COMPOSE_FILE en vez de editar docker-compose.yml.
#
# Monta el cache del panel de proyectos y finanzas en SÓLO LECTURA (`:ro`),
# para que el servidor MCP `kexxy_panel` pueda leerlo. El `:ro` no es
# decorativo: es la garantía de que la IA no puede escribir sobre el estado
# del panel aunque quisiera.
#
# KEXXY_PANEL_DIR permite mover el repo `panel` sin editar este archivo.
services:
  odysseus:
    volumes:
      - ${KEXXY_PANEL_DIR:-../panel}:/app/kexxy-panel:ro
      # Los proyectos, para que la IA pueda leerlos.
      #
      # El workspace del agente tiene que ser un directorio que exista DENTRO
      # del contenedor: vet_workspace() valida contra el filesystem del
      # servidor, no del host. Sin este montaje, D:\Disco D\GitHubRepos
      # simplemente no aparece en el selector.
      #
      # Va en SOLO LECTURA por defecto. La IA puede leer, buscar y analizar
      # todos los proyectos, pero no modificarlos ni borrarlos. Para permitir
      # que escriba —agente de codigo de verdad— hay que sacarle el `:ro`, y
      # es una decision consciente: las herramientas de archivo del agente
      # incluyen escritura, parches y bash.
      - ${KEXXY_REPOS_DIR:-..}:/app/repos:ro
    environment:
      - KEXXY_PANEL_CACHE=/app/kexxy-panel/cache.json
      # Habilita que la interfaz llame al panel para disparar acciones
      # (indexar un proyecto). Ensancha connect-src en la CSP con este único
      # origen loopback. El navegador corre en Windows, así que llega directo;
      # el contenedor sigue sin alcanzar al panel y no le hace falta.
      # Vaciar esta variable revierte la CSP a la de upstream.
      - KEXXY_PANEL_ORIGIN=${KEXXY_PANEL_ORIGIN:-http://127.0.0.1:4321}
